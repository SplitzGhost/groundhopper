<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + kein Zoom: Inhalt reicht bis unter Notch und Home-Indikator wie eine native App -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script>
      // Auf dem Handy: Die App ist für 393 pt Breite (iPhone 15/16 Pro) gestaltet und wird auf jedes
      // Display skaliert – kleine iPhones zeigen alles etwas kleiner, Max-Modelle etwas größer, aber immer gleich aufgeteilt.
      (function () {
        var BASE = 393
        var meta = document.querySelector('meta[name=viewport]')
        var portrait = Math.min(screen.width, screen.height)
        if (!meta || !matchMedia('(pointer: coarse)').matches || portrait < 300 || portrait > 520) return
        var fit = function () {
          var landscape = matchMedia('(orientation: landscape)').matches
          var w = landscape ? Math.max(screen.width, screen.height) : portrait
          var width = Math.round(w * BASE / portrait)
          meta.setAttribute('content', 'width=' + width + ', user-scalable=no, viewport-fit=cover')
        }
        fit()
        addEventListener('orientationchange', fit)
      })();

      // Vom Home-Bildschirm (Vollbild): iOS meldet mit durchsichtiger Statusleiste eine um die Statusleiste
      // zu kleine Höhe – unten bliebe ein leerer Streifen. Deshalb die echte Bildschirmhöhe selbst ausrechnen.
      (function () {
        var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches
        if (!standalone) return
        var root = document.documentElement
        var size = function () {
          var landscape = matchMedia('(orientation: landscape)').matches
          var sw = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height)
          var sh = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height)
          // Bildschirmhöhe in CSS-Pixeln des (ggf. skalierten) Layouts
          var h = Math.max(innerHeight, Math.round(sh * innerWidth / sw))
          root.style.setProperty('--app-h', h + 'px')
          root.classList.add('standalone')
        }
        size()
        addEventListener('resize', size)
        addEventListener('orientationchange', function () { setTimeout(size, 300) })
        addEventListener('load', size)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Als Web-App vom Home-Bildschirm: Vollbild ohne Safari-Leisten -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groundhopper" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter nur als Ersatz außerhalb von Apple-Geräten; auf dem iPhone greift SF Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Groundhopper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- VORÜBERGEHEND: Diagnose für den Streifen unten in der Home-Bildschirm-App. Antippen blendet sie aus. -->
    <script>
      (function () {
        var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches
        if (!standalone) return
        document.documentElement.style.background = '#ff00ff'
        var probe = document.createElement('div')
        probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;' +
          'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)'
        document.body.appendChild(probe)
        var box = document.createElement('div')
        box.style.cssText = 'position:fixed;left:12px;right:12px;top:40%;z-index:99999;padding:10px 12px;border-radius:14px;' +
          'background:rgba(0,0,0,.82);color:#fff;font:600 13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap'
        box.onclick = function () { box.remove(); document.documentElement.style.background = '' }
        document.body.appendChild(box)
        var show = function () {
          var cs = getComputedStyle(probe)
          var dev = document.querySelector('.device')
          var vv = window.visualViewport
          box.textContent = [
            'DIAGNOSE (antippen = weg)',
            'screen ' + screen.width + 'x' + screen.height + '  dpr ' + devicePixelRatio,
            'inner ' + innerWidth + 'x' + innerHeight + '  outerH ' + outerHeight,
            'docEl ' + document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight,
            'vv ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + ' s' + vv.scale.toFixed(3) + ' top' + Math.round(vv.offsetTop) : '-'),
            'safe top ' + cs.paddingTop + ' bottom ' + cs.paddingBottom,
            '--app-h ' + (document.documentElement.style.getPropertyValue('--app-h') || '-') + '  class ' + document.documentElement.className,
            'device ' + (dev ? Math.round(dev.getBoundingClientRect().top) + '..' + Math.round(dev.getBoundingClientRect().bottom) : '-'),
            'standalone ' + navigator.standalone + ' / ' + matchMedia('(display-mode: standalone)').matches,
            'vp ' + document.querySelector('meta[name=viewport]').content,
            (navigator.userAgent.match(/OS [\d_]+/) || [''])[0],
          ].join('\n')
        }
        show()
        setTimeout(show, 1500)
        addEventListener('resize', show)
      })()
    </script>
  </body>
</html>
