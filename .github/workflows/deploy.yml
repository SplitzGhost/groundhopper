# Baut die App und veröffentlicht sie auf GitHub Pages.
# Läuft bei jedem Push auf main, alle 6 Stunden (frischer Spielplan) und auf Knopfdruck.
# Optional: Repo-Secret FOOTBALL_DATA_API_KEY für football-data.org, sonst freie Demo-Quellen.

name: Website

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Spielplan laden
        run: node tools/build-data.ts
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: App bauen
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_DATA: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
